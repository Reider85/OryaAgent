# A-11: Alembic configuration — migrations orchestrate the plain ``.sql``
# files in app/db/migrations/ through thin revision wrappers in
# alembic/versions/ (upgrades read the .sql files; downgrades are inline).
#
# ``sqlalchemy.url`` is intentionally NOT set here: app.db.migrate.alembic_config()
# injects it from Settings.database_url (env vars > .env > config.yaml > defaults)
# before any command runs, and alembic/env.py falls back to the same source —
# a bare ``alembic upgrade head`` from the repo root works too.
[alembic]
script_location = alembic
# Template for generated revision files (hand-written wrappers keep it anyway).
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
