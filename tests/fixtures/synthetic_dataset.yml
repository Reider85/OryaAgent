    def get_scenario(self, scenario_id: str) -> Dict[str, Any]:
        """Get a specific scenario by ID."""
        for scenario in self.scenarios:
            if scenario["id"] == scenario_id:
                return scenario
        raise ValueError(f"Scenario {scenario_id} not found")
    
    def get_all_scenarios(self) -> List[Dict[str, Any]]:
        """Get all scenarios."""
        return self.scenarios
    
    def get_random_scenario(self) -> Dict[str, Any]:
        """Get a random scenario."""
        import random
        return random.choice(self.scenarios)
    
    def get_scenarios_by_tier(self, tier: str) -> List[Dict[str, Any]]:
        """Get scenarios by tier."""
        return [scenario for scenario in self.scenarios if scenario["expected_plan"]["tier"] == tier]
    
    def get_scenarios_by_difficulty(self, difficulty: str) -> List[Dict[str, Any]]:
        """Get scenarios by difficulty level."""
        difficulty_mapping = {
            "easy": ["small"],
            "medium": ["small", "large"],
            "hard": ["large", "tournament"],
            "expert": ["tournament"]
        }
        
        tiers = difficulty_mapping.get(difficulty, [])
        return [scenario for scenario in self.scenarios if scenario["expected_plan"]["tier"] in tiers]
    
    def generate_test_cases(self, count: int = 10) -> List[Dict[str, Any]]:
        """Generate test cases for evaluation."""
        import random
        
        test_cases = []
        scenarios = self.get_all_scenarios()
        
        for i in range(count):
            scenario = random.choice(scenarios)
            test_case = {
                "id": f"test_case_{i+1}",
                "scenario_id": scenario["id"],
                "task": scenario["task"],
                "expected_plan": scenario["expected_plan"],
                "expected_execution": scenario["expected_execution"],
                "expected_verdict": scenario["expected_verdict"],
                "difficulty": self._get_difficulty_level(scenario["expected_plan"]["tier"])
            }
            test_cases.append(test_case)
        
        return test_cases
    
    def _get_difficulty_level(self, tier: str) -> str:
        """Get difficulty level for a tier."""
        if tier == "small":
            return "easy"
        elif tier == "large":
            return "medium"
        else:  # tournament
            return "hard"


def load_synthetic_dataset(file_path: str) -> SyntheticDataset:
    """Load synthetic dataset from file."""
    with open(file_path, 'r') as f:
        data = json.load(f)
    
    dataset = SyntheticDataset()
    dataset.scenarios = data["scenarios"]
    
    return dataset


def save_synthetic_dataset(dataset: SyntheticDataset, file_path: str) -> None:
    """Save synthetic dataset to file."""
    data = {
        "scenarios": dataset.scenarios,
        "generated_at": dataset.__class__.__name__,
        "total_scenarios": len(dataset.scenarios)
    }
    
    with open(file_path, 'w') as f:
        json.dump(data, f, indent=2)


