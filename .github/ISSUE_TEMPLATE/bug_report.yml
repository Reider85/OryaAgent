name: Bug report
description: Report a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I run `orya ...`, then ..."
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - CLI (`orya`)
        - FastAPI app
        - Chainlit UI
        - LLM provider seam
        - Memory (MD files)
        - Permissions
        - Docker / deployment
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OryaAgent version
      placeholder: "7.0.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run `...`
        2. ...
        3. See error