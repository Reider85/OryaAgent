name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Type-check (mypy)
        run: uv run mypy app
        continue-on-error: true
      - name: Validate docker-compose.yml parses
        run: |
          uv run python -c "import yaml,sys; \
            data=yaml.safe_load(open('docker-compose.yml')); \
            assert 'services' in data and len(data['services'])>=13, 'compose broken'; \
            print('OK', list(data['services']))"

  test-matrix:
    name: Tests (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev
      - run: uv run python -c "import app"
      - name: Run unit+e2e+smoke with coverage
        run: uv run pytest tests/unit tests/e2e tests/smoke --cov=app --cov-report=xml --cov-report=term-missing --continue-on-collection-errors --maxfail=20
        env:
          CI: "true"
      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  integration:
    name: Integration (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orya
          POSTGRES_PASSWORD: orya
          POSTGRES_DB: orya_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://orya:orya@localhost:5432/orya_test
      REDIS_URL: redis://localhost:6379/0
      ORYA_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - name: Run migrations
        run: uv run python -m app.db.migrate
      - name: Run integration tests (без live LLM)
        run: uv run pytest tests/integration --continue-on-collection-errors --maxfail=20 --tb=short -k "not live"
        env:
          CI: "true"
          DEEPSEEK_API_KEY: ""   # явно пустой — live-тесты должны скипаться

  audit:
    name: Security audit (pip-audit)
    needs: lint
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Audit (block on high/critical)
        run: |
          uv run pip-audit --strict --output json > audit.json || true
          uv run python scripts/audit_gate.py audit.json
        continue-on-error: false
      - name: Audit (report all)
        run: uv run pip-audit --strict --desc
        continue-on-error: true
      - name: File security issue
        if: failure()
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          filename: .github/ISSUE_TEMPLATE/audit_failure.md
          assignees: Reider85
          labels: security, dependencies

  coverage:
    name: Upload coverage to Codecov
    needs: [test-matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-py*
          merge-multiple: false
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: coverage-py3.11/coverage.xml,coverage-py3.12/coverage.xml,coverage-py3.13/coverage.xml,coverage-py3.14/coverage.xml
          flags: py3.11,py3.12,py3.13,py3.14

  build:
    name: Build dist
    needs: [test-matrix, integration, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run python -m build
      - name: Upload dist artifact
        if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
          if-no-files-found: error