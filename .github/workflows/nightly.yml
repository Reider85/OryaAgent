name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC каждый день
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly-prerelease:
    if: github.repository == 'Reider85/OryaAgent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Resolve tag
        id: ver
        run: |
          VERSION=$(make version)
          DATE=$(date -u +%Y%m%d)
          DATE_ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=nightly-${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$DATE_ISO" >> $GITHUB_OUTPUT

      - name: Create/update nightly release
        uses: pyTooling/Actions/releaser@5c6a1aec0bb5a0243ad0c6f98a8e1258c019e679
        # pyTooling/Actions releaser v9.3.3 — pinned by SHA (B-05)
        with:
          tag: ${{ steps.ver.outputs.tag }}
          name: "Nightly ${{ steps.ver.outputs.tag }}"
          prerelease: true
          make_latest: "false"
          body: |
            Nightly build from main @ ${{ steps.ver.outputs.tag }}

            Версия pyproject: ${{ steps.ver.outputs.version }}
            Дата: ${{ steps.ver.outputs.date }}

            > Это автоматически собранный nightly-билд. Используй на свой риск.