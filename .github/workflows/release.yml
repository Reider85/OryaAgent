name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/**"        # workflows shouldn't trigger release
      - "tests/**"          # tests aren't releases
      - "scripts/**"
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as prerelease"
        default: "true"

permissions:
  contents: write   # нужно для создания тегов и релизов

jobs:
  prerelease-on-push:
    name: Prerelease (push to main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна история для changelog

- name: Read version from pyproject.toml
        id: ver
        run: |
          VERSION=$(make version)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v${VERSION}-dev.${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG"

      - name: Compute compare URL
        id: cmp
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${#BEFORE}" -eq 40 ] && [ "${BEFORE//0/}" = "" ]; then
            URL="https://github.com/${{ github.repository }}/commits/${{ github.sha }}"
          else
            URL="https://github.com/${{ github.repository }}/compare/${BEFORE}...${{ github.sha }}"
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Skip if release for this SHA exists
        id: dedup
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          SHA_TAG=$(gh release list --repo "${{ github.repository }}" --json tagName \
                    --jq ".[] | select(.tagName|endswith(\"+${SHORT_SHA}\")) | .tagName" | head -1)
          if [ -n "$SHA_TAG" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create prerelease
        if: steps.dedup.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Pre-release ${{ steps.ver.outputs.tag }}"
          body: |
            Automated prerelease from commit ${{ github.sha }}

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}

            Full changelog: ${{ steps.cmp.outputs.url }}
          prerelease: true
          generate_release_notes: true
          make_latest: "false"

  release-on-tag:
    name: Release (tag v*.*.*)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Build dist
        run: |
          uv sync --frozen
          uv run python -m build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true   # auto-changelog из PR/commit titles
          make_latest: "true"
          draft: false
          body: |
            ## OryaAgent ${{ github.ref_name }}

            ### Highlights
            <!-- Breaking changes or migration notes go here -->

            ### Installation
            ```bash
            uv tool install orya-agent==${{ github.ref_name }}
            # или
            pip install orya-agent==${{ github.ref_name }}
            ```

            ---

  docker:
    name: Build & push image
    needs: []   # параллельно release-on-tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  prerelease-docker:
    name: Build & push prerelease image
    needs: []   # параллельно prerelease-on-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=main
          labels: ${{ steps.meta.outputs.labels }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: org.opencontainers.image.title=OryaAgent-Prerelease,org.opencontainers.image.description=Development build from main branch
