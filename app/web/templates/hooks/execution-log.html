{% extends "base.html" %}

{% block title %}{{ title }} - OryaAgent{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">{{ title }}</h1>
        <p class="text-gray-600">{{ description }}</p>
    </div>

    <!-- Filters -->
    <div class="bg-white rounded-lg shadow p-6 mb-8">
        <h2 class="text-xl font-semibold text-gray-900 mb-4">Filters</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Session ID</label>
                <input type="text" id="session-filter" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Filter by session ID">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tool Name</label>
                <input type="text" id="tool-filter" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Filter by tool name">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Hook Name</label>
                <input type="text" id="hook-filter" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Filter by hook name">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                <select id="status-filter" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">All</option>
                    <option value="true">Success</option>
                    <option value="false">Failed</option>
                </select>
            </div>
        </div>
        <div class="mt-4 flex justify-between items-center">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Time Window</label>
                <select id="time-filter" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="1">Last 1 hour</option>
                    <option value="6">Last 6 hours</option>
                    <option value="24" selected>Last 24 hours</option>
                    <option value="72">Last 3 days</option>
                    <option value="168">Last 7 days</option>
                </select>
            </div>
            <div class="flex space-x-2">
                <button onclick="applyFilters()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">
                    Apply Filters
                </button>
                <button onclick="clearFilters()" class="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700 transition-colors">
                    Clear
                </button>
            </div>
        </div>
    </div>

    <!-- Execution Log -->
    <div class="bg-white rounded-lg shadow p-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold text-gray-900">Execution Log</h2>
            <div class="flex items-center space-x-4">
                <span class="text-sm text-gray-600">Showing <span id="results-count">0</span> results</span>
                <button onclick="exportData()" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition-colors text-sm">
                    Export CSV
                </button>
            </div>
        </div>
        
        <div id="execution-log" class="space-y-4">
            <div class="text-center text-gray-500 py-8">
                <svg class="w-12 h-12 mx-auto mb-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                </svg>
                <p>Loading execution log...</p>
            </div>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="mt-6 flex justify-center space-x-2">
            <!-- Pagination will be dynamically generated -->
        </div>
    </div>
</div>

<script>
let currentPage = 1;
let currentFilters = {};
let isLoading = false;

// Load execution log with current filters
async function loadExecutionLog(page = 1) {
    if (isLoading) return;
    isLoading = true;
    
    try {
        const params = new URLSearchParams({
            limit: 20,
            offset: (page - 1) * 20,
            ...currentFilters
        });
        
        const response = await fetch(`/api/hooks/executed?${params}`);
        const data = await response.json();
        
        displayExecutionLog(data.entries);
        updatePagination(data.total, page);
        document.getElementById('results-count').textContent = data.total;
    } catch (error) {
        console.error('Failed to load execution log:', error);
        document.getElementById('execution-log').innerHTML = `
            <div class="text-center text-red-500 py-8">
                <p>Failed to load execution log. Please try again.</p>
            </div>
        `;
    } finally {
        isLoading = false;
    }
}

// Display execution log entries
function displayExecutionLog(entries) {
    const container = document.getElementById('execution-log');
    
    if (entries.length === 0) {
        container.innerHTML = `
            <div class="text-center text-gray-500 py-8">
                <svg class="w-12 h-12 mx-auto mb-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                </svg>
                <p>No executions found matching your criteria</p>
            </div>
        `;
        return;
    }
    
    container.innerHTML = entries.map(execution => `
        <div class="border rounded-lg p-4 hover:bg-gray-50 transition-colors">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <h3 class="font-medium text-gray-900">${execution.tool_name} → ${execution.hook_name}</h3>
                    <p class="text-sm text-gray-600">${execution.session_id} • ${new Date(execution.timestamp).toLocaleString()}</p>
                </div>
                <span class="px-2 py-1 text-xs rounded-full ${execution.success ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                    ${execution.success ? 'Success' : 'Failed'}
                </span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                <div>
                    <span class="text-gray-500">Type:</span>
                    <span class="ml-2 font-medium">${execution.hook_type}</span>
                </div>
                <div>
                    <span class="text-gray-500">Duration:</span>
                    <span class="ml-2 font-medium">${execution.duration_ms ? execution.duration_ms + 'ms' : '-'}</span>
                </div>
                <div>
                    <span class="text-gray-500">ID:</span>
                    <span class="ml-2 font-mono text-xs">${execution.id}</span>
                </div>
            </div>
            ${execution.message ? `
                <div class="mt-2 p-3 bg-gray-50 rounded-md">
                    <p class="text-sm text-gray-700">${execution.message}</p>
                </div>
            ` : ''}
            <div class="mt-2 flex space-x-2">
                <button onclick="viewDetails('${execution.id}')" class="text-blue-600 hover:text-blue-800 text-sm">
                    View Details
                </button>
                ${!execution.success ? `
                    <button onclick="viewError('${execution.id}')" class="text-red-600 hover:text-red-800 text-sm">
                        View Error
                    </button>
                ` : ''}
            </div>
        </div>
    `).join('');
}

// Update pagination
function updatePagination(total, currentPage) {
    const totalPages = Math.ceil(total / 20);
    const container = document.getElementById('pagination');
    
    if (totalPages <= 1) {
        container.innerHTML = '';
        return;
    }
    
    let paginationHTML = '';
    
    // Previous button
    paginationHTML += `
        <button onclick="loadExecutionLog(${currentPage - 1})" 
                ${currentPage === 1 ? 'disabled' : ''} 
                class="px-3 py-2 rounded-md ${currentPage === 1 ? 'bg-gray-100 text-gray-400' : 'bg-white border border-gray-300 hover:bg-gray-50'}">
            Previous
        </button>
    `;
    
    // Page numbers
    for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
        paginationHTML += `
            <button onclick="loadExecutionLog(${i})" 
                    class="px-3 py-2 rounded-md ${i === currentPage ? 'bg-blue-600 text-white' : 'bg-white border border-gray-300 hover:bg-gray-50'}">
                ${i}
            </button>
        `;
    }
    
    // Next button
    paginationHTML += `
        <button onclick="loadExecutionLog(${currentPage + 1})" 
                ${currentPage === totalPages ? 'disabled' : ''} 
                class="px-3 py-2 rounded-md ${currentPage === totalPages ? 'bg-gray-100 text-gray-400' : 'bg-white border border-gray-300 hover:bg-gray-50'}">
            Next
        </button>
    `;
    
    container.innerHTML = paginationHTML;
}

// Apply filters
function applyFilters() {
    currentFilters = {
        session_id: document.getElementById('session-filter').value || undefined,
        tool_name: document.getElementById('tool-filter').value || undefined,
        hook_name: document.getElementById('hook-filter').value || undefined,
        success: document.getElementById('status-filter').value || undefined,
        hours: document.getElementById('time-filter').value || 24
    };
    
    currentPage = 1;
    loadExecutionLog(currentPage);
}

// Clear filters
function clearFilters() {
    document.getElementById('session-filter').value = '';
    document.getElementById('tool-filter').value = '';
    document.getElementById('hook-filter').value = '';
    document.getElementById('status-filter').value = '';
    document.getElementById('time-filter').value = '24';
    
    currentFilters = {};
    currentPage = 1;
    loadExecutionLog(currentPage);
}

// Export data as CSV
function exportData() {
    const params = new URLSearchParams(currentFilters);
    window.open(`/api/hooks/executed/csv?${params}`, '_blank');
}

// View execution details
function viewDetails(executionId) {
    window.open(`/ui/hooks/detail/${executionId}`, '_blank');
}

// View error details
function viewError(executionId) {
    // This would open a modal or new page with error details
    alert(`Error details for execution ${executionId} would be shown here`);
}

// Initialize page
document.addEventListener('DOMContentLoaded', function() {
    loadExecutionLog(1);
    
    // Auto-refresh every 30 seconds
    setInterval(() => loadExecutionLog(currentPage), 30000);
});
</script>
{% endblock %}
