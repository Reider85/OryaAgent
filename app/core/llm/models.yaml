# Model alias registry for the OryaAgent LLM seam (M-01).
# Declarative mapping: alias -> (provider, model_id, capabilities).
# Business code refers to models via aliases — never hardcode model ids.
#
# Fields:
#   alias            - stable name used in config / UI / code
#   provider         - must exist in providers.yaml
#   model_id         - actual model string sent to the provider API
#   context_window   - max context tokens (informational, used by M-06 later)
#   supports_tools   - false for reasoning models without function-calling
#   supports_streaming
#   suggests         - recommended replacement when supports_tools is false

models:
  # ---------------------------------------------------------------- western
  - alias: claude-sonnet-3.5
    provider: anthropic
    model_id: claude-3-5-sonnet-latest
    context_window: 200000
    supports_tools: true
    supports_streaming: true
    description: Default MVP model (Anthropic)

  - alias: claude-opus-4
