    default_model: local-model
    tier: local
    description: LocalAI (drop-in OpenAI replacement)

  jan:
    adapter: openai_compat
    base_url: http://localhost:1337/v1
    env_var: null
    api_key_placeholder: jan
    default_model: local-model
    tier: local
    description: Jan local server

  gpt4all:
    adapter: openai_compat
    base_url: http://localhost:4891/v1
    env_var: null
    api_key_placeholder: gpt4all
    default_model: local-model
    tier: local
    description: GPT4All desktop local inference
