    gpt-4o-mini: {supports_tools: true, supports_streaming: true, supports_system_prompt: true, context_window: 128000}
    o1: {supports_tools: false, supports_streaming: false, supports_system_prompt: false, context_window: 200000, suggests: gpt-4o}
    o3-mini: {supports_tools: true, supports_streaming: true, supports_system_prompt: true, context_window: 200000}

