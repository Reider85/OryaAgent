# Per-model capability matrix (M-01 capability-detection).
# Used by get_llm() when the model is not a registered alias, and exposed
# via /llm/models. Keyed by provider -> model_id.
#
# Reasoning models (DeepSeek-R1, o1, Qwen-QwQ, GLM-Zero, MiMo) ship WITHOUT
# reliable tool-calling — get_llm() fails fast on them unless
# require_tools=False is passed (plain-chat fallback mode).

capabilities:
  anthropic:
    claude-3-5-sonnet-latest: {supports_tools: true, supports_streaming: true, supports_system_prompt: true, context_window: 200000}
    claude-opus-4-20250514: {supports_tools: true, supports_streaming: true, supports_system_prompt: true, context_window: 200000}
    claude-3-5-haiku-latest: {supports_tools: true, supports_streaming: true, supports_system_prompt: true, context_window: 200000}

